version: 2

updates:
  # ---------------------------------------------------------------------------
  # Java dependencies. The app ships as a native installer, so a vulnerable
  # transitive dependency travels to every machine in the association and stays
  # there until someone reinstalls — there is no server to patch centrally.
  # ---------------------------------------------------------------------------
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "Deps"
    groups:
      # One pull request per family instead of one per artifact: JavaFX and
      # Ikonli publish every module in lockstep, so splitting them produces
      # pull requests that cannot pass CI on their own.
      javafx:
        patterns:
          - "org.openjfx:*"
      ikonli:
        patterns:
          - "org.kordamp.ikonli:*"
      test-tooling:
        patterns:
          - "org.junit.jupiter:*"
          - "org.mockito:*"
      # kernel and layout are one library split across two artifacts and have to
      # move together. Ungrouped, Dependabot opens a pull request per artifact,
      # each pairing a new version with the old one, and neither builds.
      itext:
        patterns:
          - "com.itextpdf:*"
    ignore:
      # JavaFX tracks the JDK it is built for, and this application targets
      # Java 17. A major bump therefore ships class files a Java 17 runtime
      # cannot load - and the failure hides, because CI uses a Full JDK whose
      # bundled JavaFX shadows the Maven artifact. Green CI on a build that
      # cannot start anywhere else is worse than a red one, so major updates
      # here are a deliberate decision, taken alongside moving the JDK.
      - dependency-name: "org.openjfx:*"
        update-types: ["version-update:semver-major"]

  # ---------------------------------------------------------------------------
  # GitHub Actions. Pinned to commit SHAs in the workflows, which is what makes
  # the supply chain auditable but also what makes them invisible to a human
  # reader — Dependabot is what keeps the pins from silently rotting.
  # ---------------------------------------------------------------------------
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "CI"
    groups:
      # init and analyze are two entry points into the same action and refuse to
      # run at different versions: "Loaded a configuration file for version
      # '3.37.9', but running version '4.37.9'". Ungrouped, Dependabot opens a
      # pull request per entry point, each one mixing the old version with the
      # new, so neither can go green and neither can be merged first.
      codeql-action:
        patterns:
          - "github/codeql-action*"
