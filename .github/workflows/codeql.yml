name: CodeQL

# CodeQL follows data from where it enters the program to where it is used, so
# it catches the class of bug that grep cannot: a value that is safe at the point
# it is read and unsafe several calls later. Worth having on a codebase that
# decrypts credentials and talks to two databases.

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    # Mondays 06:00 UTC. The scheduled run is not redundant with the pull-request
    # run: queries are updated continuously, so code that was clean when merged
    # can be flagged later without anyone touching it.
    - cron: '0 6 * * 1'

permissions: {}

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze Java
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # The Full JDK is required: the project compiles against JavaFX, which a
      # standard JDK 17 does not carry. Without it the build step fails and
      # CodeQL analyses nothing while still reporting success.
      - name: Set up Liberica Full JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: liberica
          java-version: '17'
          java-package: jdk+fx
          cache: maven

      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f5948dfacef28e207b48d0905cf90c03365536d # v3
        with:
          languages: java-kotlin
          # security-and-quality goes beyond the default security suite to include
          # correctness and maintainability queries. On a codebase this size the
          # extra noise is manageable and the extra coverage is worth it.
          queries: security-and-quality

      # Built explicitly rather than by autobuild: the build needs the Full JDK
      # set up above, and an explicit command fails loudly if that ever stops
      # being true instead of quietly analysing a partial compilation.
      - name: Build
        run: mvn -B compile -DskipTests --file pom.xml

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: "/language:java-kotlin"
