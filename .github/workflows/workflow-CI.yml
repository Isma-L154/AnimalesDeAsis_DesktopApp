name: CI / Release

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]        # e.g. v1.2.3 -> builds installers and publishes a release
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: {}   # allow manual runs

# Least privilege by default: no job gets a token that can write to the
# repository unless it declares that it needs one. Only `release` does.
permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # 1. Fast feedback: compile + unit tests on Linux.
  # ---------------------------------------------------------------------------
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Liberica Full JDK 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: liberica
          java-version: '17'
          java-package: jdk+fx
          cache: maven
      - name: Build and test
        run: mvn -B clean test --file pom.xml
      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 14
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # 2. Native installers, one per OS. Runs on pushes to main (-> rolling
  #    "latest" prerelease), on v* tags (-> stable release) and manual runs.
  #    Skipped on pull requests.
  # ---------------------------------------------------------------------------
  build-installers:
    needs: test
    if: >
      github.ref == 'refs/heads/main'
      || startsWith(github.ref, 'refs/tags/v')
      || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: AnimalesDeAsis-windows
            pattern: target/installer/*.exe
          - os: macos-latest
            artifact: AnimalesDeAsis-macos
            pattern: target/installer/*.dmg
          - os: ubuntu-latest
            artifact: AnimalesDeAsis-linux
            pattern: target/installer/*.deb
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Liberica Full JDK 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: liberica
          java-version: '17'
          java-package: jdk+fx
          cache: maven

      # Version: from the tag (v1.2.3 -> 1.2.3) for releases, or a unique dev
      # version (1.0.<run_number>) for rolling "latest" builds off main.
      # jpackage will only accept a strictly numeric version: on Windows it maps
      # to a Windows Installer ProductVersion, on macOS to CFBundleVersion. A tag
      # like v1.0.0-rc1 strips to "1.0.0-rc1", which is rejected — but only at the
      # jpackage step, after a full build has already run on three platforms, and
      # with a message that does not mention the tag. Validate up front so a bad
      # tag fails in seconds with a message that says what to do about it.
      - name: Resolve version
        id: ver
        shell: bash
        run: |
          REF="${GITHUB_REF_NAME}"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then VALUE="${REF#v}";
          else VALUE="1.0.${GITHUB_RUN_NUMBER}"; fi

          if [[ ! "$VALUE" =~ ^[0-9]+(\.[0-9]+){0,2}$ ]]; then
            echo "::error::Tag '${REF}' resolves to version '${VALUE}', which jpackage will reject."
            echo "::error::Release tags must be strictly numeric: v1.2.3, v1.2 or v1 — no suffixes such as -rc1 or -beta."
            exit 1
          fi
          echo "value=${VALUE}" >> "$GITHUB_OUTPUT"

      # Inject the encrypted Firebase bundle from a secret (kept out of git).
      # If the secret is absent the app still builds and runs in offline-only mode.
      - name: Inject Firebase credentials
        shell: bash
        env:
          FIREBASE_CREDENTIALS_ENC: ${{ secrets.FIREBASE_CREDENTIALS_ENC }}
        run: |
          if [ -n "$FIREBASE_CREDENTIALS_ENC" ]; then
            mkdir -p src/main/resources/FireConfig
            echo "$FIREBASE_CREDENTIALS_ENC" | base64 -d > src/main/resources/FireConfig/firebase-credentials.enc
            echo "✅ Firebase credentials injected."
          else
            echo "⚠️ No FIREBASE_CREDENTIALS_ENC secret set; building in offline-only mode."
          fi

      - name: Build application
        shell: bash
        run: mvn -B clean package -DskipTests -Dapp.version=${{ steps.ver.outputs.value }} --file pom.xml

      - name: Create native installer
        shell: bash
        run: mvn -B jpackage:jpackage -Dapp.version=${{ steps.ver.outputs.value }} --file pom.xml

      - name: Upload installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.pattern }}
          retention-days: 90
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # 3. Publish installers to a GitHub Release.
  #    - v* tag  -> a permanent, versioned release.
  #    - main    -> a rolling "latest" prerelease that always holds the newest
  #                 build (previous one is replaced), so testers just grab the
  #                 latest .exe without waiting for a formal version.
  # ---------------------------------------------------------------------------
  release:
    needs: build-installers
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # download-artifact reads from the current run via the runner's own token
      # and should not need this. Granted anyway: unlike the other jobs, this one
      # never runs on a pull request, so the assumption cannot be tested before
      # it reaches main — and a wrong assumption here breaks publishing. A
      # read-only scope is a cheap hedge against an untestable guess.
      actions: read
    steps:
      - name: Download all installers
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          merge-multiple: true
          path: ./release-assets/

      - name: List assets
        run: find ./release-assets -type f

      - name: Resolve release parameters
        id: rel
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "title=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
            echo "title=Latest dev build" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi

      # For the rolling build, delete the previous "latest" release + tag so the
      # new one is recreated pointing at the current commit.
      - name: Reset rolling 'latest' release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete latest --yes --cleanup-tag -R "$GITHUB_REPOSITORY" || true

      - name: Publish release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          name: ${{ steps.rel.outputs.title }}
          prerelease: ${{ steps.rel.outputs.prerelease }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            ./release-assets/*.exe
            ./release-assets/*.dmg
            ./release-assets/*.deb
          fail_on_unmatched_files: false
